; SmallTV firmware: clock + WiFi setup + web OTA.
; Target: original GeekMagic SmallTV, ESP-12F (ESP8266), 4 MB flash.
;
; Build:            pio run
; OTA upload:       pio run -t upload                  (HTTP POST to http://smalltv/update)
;                   pio run -t upload --upload-port 192.168.1.50
; Serial upload:    pio run -e smalltv_serial -t upload
; Serial monitor:   pio device monitor
;
; Optional build-time secrets come from secrets.env (gitignored) or the
; environment; see secrets.env.example.

[platformio]
default_envs = smalltv

[env]
platform = espressif8266 @ 4.2.1
board = esp12e
framework = arduino
; Same flash layout as the stock-replacement smalltv-mod firmware (1 MB LittleFS, rest sketch + OTA slot), so
; moving between the two images over OTA never needs a re-partition.
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs
monitor_speed = 115200
extra_scripts = pre:scripts/secrets.py
build_flags =
	-D FW_VERSION=\"0.1.0\"
	; MSS 1460 + bigger TCP window: the default low-memory lwIP (MSS 536) makes
	; a 430 KB OTA upload take over 4 minutes.
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
lib_deps =
	moononournation/GFX Library for Arduino @ 1.6.9
	tzapu/WiFiManager @ 2.0.17

[env:smalltv]
upload_protocol = custom
upload_port = smalltv
upload_command = $PROJECT_DIR/scripts/ota-upload.sh $SOURCE $UPLOAD_PORT

[env:smalltv_serial]
upload_speed = 921600
